<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";
  
  // Define your exact tabs here. This prevents "Facebook" from being a tab.
  const myTabs = ["ABOUT US", "WHAT DO WE COLLECT", "WHAT WE CAN'T ACCEPT", "CONTACT SHEP", "MONETARY DONATIONS"];

  fetch(scriptUrl).then(r => r.json()).then(data => {
    var container = document.getElementById('tabs');
    var contentArea = document.getElementById('content-area');
    
    myTabs.forEach(tName => {
      var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = tName;
      var panel = document.createElement('div'); panel.className = 'page-panel';
      panel.id = 'panel-' + tName;
      panel.innerHTML = "Loading...";
      contentArea.appendChild(panel);
      
      btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        panel.classList.add('active');
        
        if(panel.innerHTML === "Loading...") {
           // We filter the data we already fetched to show only relevant rows
           var filtered = data.filter(row => row[0].toString().trim() === tName);
           panel.innerHTML = renderContent(filtered);
        }
      };
      container.appendChild(btn);
    });
    container.firstChild.click();
  });

  function renderContent(items) {
    let html = "";
    items.forEach(it => {
      html += `<p>${it[1] || ""} <a href="${it[2] || '#'}" target="_blank">${it[2] ? 'Link' : ''}</a></p>`;
    });
    return html;
  }
</script>
