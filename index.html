<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #fcfaff; color: #333; }
    p { white-space: pre-wrap; margin: 5px 0; }
    h4 { margin: 10px 0 5px 0; color: #916bbf; border-bottom: 1px dashed #ac8ad4; padding-bottom: 3px; }
    
    /* Header Container */
    .shep-header { padding: 20px; background: #ffffff; border-bottom: 2px solid #78a198; margin-bottom: 10px; }
    .shep-logo { max-width: 180px; height: auto; }
    .shep-tagline { font-weight: bold; color: #916bbf; margin-top: 5px; font-size: 1.1em; }

    /* Tab Menu */
    .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px 20px; }
    .tab { width: 130px; height: 50px; background: #ac8ad4; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 0.75em; font-weight: bold; transition: background 0.2s; }
    .tab.active { background: #916bbf; }
    
    /* Content Boxes */
    .page-panel { display: none; padding: 20px; max-width: 900px; margin: auto; text-align: left; }
    .page-panel.active { display: block; }
    .content-box { border: 3px solid #78a198; border-radius: 25px; padding: 20px; margin-bottom: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .commentary-box { background: #fdfaf6; border-left: 5px solid #78a198; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    
    /* Maintenance Mode Layout Box */
    .maintenance-box { max-width: 600px; margin: 50px auto; padding: 40px; border: 3px dashed #916bbf; border-radius: 25px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .maintenance-box h2 { color: #916bbf; margin-top: 0; }
    
    /* Media Grid for items */
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 10px; }
    .item-card { border: 1px solid #e2ecea; border-radius: 15px; padding: 10px; text-align: center; background: #fff; }
    .item-img { max-width: 100%; height: 120px; object-fit: cover; border-radius: 8px; display: block; margin: 5px auto; }
    .large-img { max-width: 100%; max-height: 450px; border-radius: 12px; display: block; margin: 10px 0; }
    
    /* Button & Link Styles */
    .donate-btn { display: inline-block; padding: 14px 28px; background-color: #78a198; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; transition: background 0.2s; }
    .donate-btn:hover { background-color: #5e827a; }
    .pin-link { display: inline-flex; align-items: center; gap: 5px; color: #916bbf; font-weight: bold; text-decoration: none; margin-top: 5px; }
    .pin-link:hover { text-decoration: underline; }
    .info-line { margin: 10px 0; font-size: 1.1em; color: #444; }
  </style>
</head>
<body>

  <div class="shep-header">
    <img src="https://drive.google.com/thumbnail?id=1jotHfaZhBe9jKnjWK7Ldz_MXl5Pb6Loe&sz=w500" class="shep-logo" alt="SHEP Logo">
    <div class="shep-tagline">PROMOTING SELF CARE AND HYGIENE FOR THE VULNERABLE</div>
  </div>

  <div id="tabs" class="nav-menu"></div>
  <div id="content-area"></div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbyUtkFi5-wjofBC2wAVG-zPqbvfTAKHlFXkRlQpy25za51bdOwMnkuSt_cEsJYErtab/exec";
    const configFile = "status.json"; 

    const tabMap = {
      "OUR MISSION": ["OUR MISSION"], 
      "ABOUT US": ["ABOUT US"],
      "ANNUAL APPEALS": ["ANNUAL APPEALS", "SPECIAL DRIVES"],
      "WHAT DO WE COLLECT": ["WHAT DO WE COLLECT"],
      "WHAT WE CAN'T ACCEPT": ["WHAT WE CAN'T ACCEPT"],
      "WHO WE HELP": ["WHO WE HELP", "WHO DO WE HELP"],
      "WAYS YOU CAN HELP": ["WAYS YOU CAN HELP"],
      "DONATION POINTS": ["DONATION POINTS", "DONATION POINT"],
      "SCHOOL DONORS": ["SCHOOL DONORS"],
      "REGISTRATION": ["REGISTRATION"],
      "TESTIMONIALS": ["TESTIMONIALS", "Testimonials"],
      "MONETARY DONATIONS": ["MONETARY DONATIONS"],
      "CONTACT SHEP": ["CONTACT SHEP"]
    };

    function cleanUrlFormat(url) {
      if (!url) return "";
      let src = url.toString().trim();
      if (src.includes("drive.google.com/file/d/")) {
        let id = src.split("/file/d/")[1].split("/")[0];
        return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
      }
      return src;
    }

    fetch(configFile)
      .then(r => r.json())
      .then(config => {
        if (config.status && config.status.toUpperCase().trim() === "OFF") {
          document.getElementById('tabs').style.display = 'none';
          document.getElementById('content-area').innerHTML = `
            <div class="maintenance-box">
              <h2>🛠️ Portal Under Maintenance</h2>
              <p style="font-size: 1.1em; line-height: 1.6; text-align: center;">
                The SHEP Portal is currently undergoing updates. We will be back operational shortly!
              </p>
            </div>
          `;
          return;
        }
        runDataPipeline();
      })
      .catch(err => { runDataPipeline(); });

    function runDataPipeline() {
      fetch(scriptUrl).then(r => r.json()).then(response => {
        const data = response.mainContent || [];
        const testimonialData = response.testimonials || [];
        const cantAcceptData = response.cantAccept || [];
        const collectData = response.collect || [];
        
        var container = document.getElementById('tabs');
        var contentArea = document.getElementById('content-area');
        
        Object.keys(tabMap).forEach(tName => {
          var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = tName;
          var panel = document.createElement('div'); panel.className = 'page-panel';
          panel.id = 'panel-' + tName;
          contentArea.appendChild(panel);
          
          btn.onclick = () => {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            panel.classList.add('active');
            
            if(panel.innerHTML === "") {
          if (tName === "OUR MISSION") {
                  let html = "<h3>OUR MISSION</h3>";
                  // Find the row where Column A is "OUR MISSION" inside the main data stream
                  let missionRow = data.find(r => r[0] && r[0].toString().toUpperCase().trim() === "OUR MISSION");
                  
                  if (missionRow) {
                     let missionText = missionRow[1] || ""; // Column B
                     let imgLink = missionRow[2] || "";     // Column C
                     
                     html += `<div class="content-box" style="text-align: center;">`;
                     if (missionText) {
                        html += `<p style="font-size: 1.4em; font-weight: bold; color: #916bbf; line-height: 1.8; margin-bottom: 20px;">${missionText}</p>`;
                     }
                     if (imgLink && imgLink.toString().trim().startsWith("http")) {
                        html += `<img src="${cleanUrlFormat(imgLink)}" class="large-img" style="margin: 0 auto; max-height: 400px;">`;
                     }
                     html += `</div>`;
                  } else {
                     html += '<div class="content-box"><p>Database Syncing...</p></div>';
                  }
                  panel.innerHTML = html;
                  return;
               }
               if (tName === "MONETARY DONATIONS") {
                  let targetUrl = 'https://tinyurl.com/SHEPDonation'; 
                  if (data && data.length > 0) {
                     let foundRow = data.find(r => r[0] && r[0].toString().toUpperCase().trim() === 'DONATIONFORMURL');
                     if (foundRow && foundRow[1]) targetUrl = foundRow[1].toString().trim();
                  }
                  panel.innerHTML = `
                    <h3>MONETARY DONATIONS</h3>
                    <div class="commentary-box">
                      <h3>Your Impact Matters</h3>
                      <p>At <strong>SHEP</strong>, every dollar donated goes toward providing hygiene essentials for those in our community. Thank you for your support.</p>
                    </div>
                    <div class="info-line" style="text-align: center;"><span>Account: Jessica Leigh Pooley</span></div>
                    <div class="info-line" style="text-align: center;"><span>BSB: 306821 / Acct: 6706014</span></div>
                    <center>
                      <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="donate-btn">Complete Donation & Get Receipt</a>
                    </center>
                  `;
                  return;
               }

               if (tName === "TESTIMONIALS") {
                  let html = "<h3>TESTIMONIALS</h3>";
                  let count = 0;
                  testimonialData.forEach((row, idx) => {
                     if (idx === 0) return;
                     let awardName = row[0] || "";
                     let imgLink = row[1] || "";
                     let storyTxt = row[2] || "";
                     if (awardName || imgLink || storyTxt) {
                        count++;
                        html += `<div class="content-box">`;
                        if (awardName) html += `<h4 style="font-size: 1.2em; color: #916bbf; border: none; margin-bottom: 10px;">${awardName}</h4>`;
                        if (storyTxt) html += `<p style="font-size: 1.05em; line-height: 1.5; margin-bottom: 15px;">${storyTxt}</p>`;
                        if (imgLink && imgLink.toString().trim().startsWith("http")) {
                           html += `<img src="${cleanUrlFormat(imgLink)}" class="large-img">`;
                        }
                        html += `</div>`;
                     }
                  });
                  panel.innerHTML = count > 0 ? html : html + '<div class="content-box"><p>Database Syncing...</p></div>';
                  return;
               }

               if (tName === "WHAT WE CAN'T ACCEPT") {
                  let html = "<h3>WHAT WE CAN'T ACCEPT</h3>";
                  let count = 0;
                  cantAcceptData.forEach((row, idx) => {
                     if (idx === 0) return;
                     let txtItem = row[1] || "";
                     let imgLink = row[3] || row[2] || ""; // Robust backup fallback for Column D or C
                     if (txtItem || imgLink) {
                        count++;
                        html += `<div class="content-box">`;
                        if (txtItem) html += `<p style="font-size: 1.1em; font-weight: bold;">${txtItem}</p>`;
                        if (imgLink && imgLink.toString().trim().startsWith("http")) {
                           html += `<img src="${cleanUrlFormat(imgLink)}" class="large-img">`;
                        }
                        html += `</div>`;
                     }
                  });
                  panel.innerHTML = count > 0 ? html : html + '<div class="content-box"><p>Database Syncing...</p></div>';
                  return;
               }

               if (tName === "WHAT DO WE COLLECT") {
                  let html = "<h3>WHAT DO WE COLLECT</h3>";
                  let sections = { "WOMEN": [], "MEN": [], "UNASSIGNED": [] };
                  let totalItems = 0;
                  
                  collectData.forEach((it, idx) => {
                     if (idx === 0) return;
                     let subCat = it[0] ? it[0].toString().trim().toUpperCase() : "UNASSIGNED";
                     let itemName = it[1] || "";
                     let imgUrl = it[3] || it[2] || ""; // Pulls the clean Share URL column
                     if (itemName) {
                        totalItems++;
                        if (!sections[subCat]) sections[subCat] = [];
                        sections[subCat].push({ name: itemName, img: cleanUrlFormat(imgUrl) });
                     }
                  });

                  ["WOMEN", "MEN", "UNASSIGNED"].forEach(gender => {
                     if (sections[gender] && sections[gender].length > 0) {
                        html += `<h4>${gender} ITEMS</h4><div class="items-grid">`;
                        sections[gender].forEach(item => {
                           html += `<div class="item-card">`;
                           if (item.img) html += `<img src="${item.img}" class="item-img">`;
                           html += `<p style="font-weight:bold; font-size:0.9em; margin-top:5px;">${item.name}</p></div>`;
                        });
                        html += `</div><br>`;
                     }
                  });
                  panel.innerHTML = totalItems > 0 ? html : html + '<div class="content-box"><p>Database Syncing...</p></div>';
                  return;
               }

               let html = "<h3>" + tName + "</h3>";
               let count = 0;
               
               data.forEach((it, rIdx) => {
                  if (rIdx === 0) return; 
                  let colA = it[0] ? it[0].toString().trim().toUpperCase() : "";
                  let matchesTab = tabMap[tName].map(k => k.toUpperCase()).some(k => colA.includes(k));
                  
                  if (matchesTab) {
                     let cols = [];
                     for (let c = 1; c <= 4; c++) {
                        if (it[c] && it[c].toString().trim() !== "") {
                           cols.push(it[c].toString().trim());
                        }
                     }
                     if (cols.length === 0) return;
                     count++;
                     html += `<div class="content-box">`;
                     if (tName === "ANNUAL APPEALS" && it[1]) {
                        html += `<h4>${it[1]}</h4>`;
                     }
                     cols.forEach(val => {
                        let isDrive = val.startsWith("http") && val.includes("drive.google.com");
                        let isImg = val.startsWith("http") && (val.includes(".jpg") || val.includes(".png") || val.includes(".jpeg") || val.includes("googleusercontent.com") || val.includes("postimg.cc") || val.includes("imgur.com") || isDrive);
                        let isNormalLink = val.startsWith("http") && !isImg;
                        
                        if (isImg) {
                           val.split(',').forEach(imgUrl => {
                              html += `<img src="${cleanUrlFormat(imgUrl)}" class="large-img">`;
                           });
                        } else if (!isNormalLink) {
                           if (tName === "ANNUAL APPEALS" && val === it[1]) return;
                           html += `<p>${val}</p>`;
                        }
                     });

                     let finalLink = cols.find(val => val && val.startsWith("http") && !val.includes("googleusercontent.com") && !val.includes("postimg.cc") && !val.includes("imgur.com") && !val.includes(".jpg") && !val.includes(".png") && !val.includes(".jpeg") && !val.includes("drive.google.com"));
                     if (finalLink) {
                        if (tName === "DONATION POINTS" || colA.includes("DONATION POINT")) {
                           html += `<a href="${finalLink}" target="_blank" class="pin-link">📍 Click for Map Location</a>`;
                        } else {
                           html += `<br><a href="${finalLink}" target="_blank" class="pin-link">Click here for more</a>`;
                        }
                     }
                     html += `</div>`;
                  }
               });
               panel.innerHTML = count > 0 ? html : html + '<div class="content-box"><p>Database Syncing...</p></div>';
            }
          };
          container.appendChild(btn);
        });
        container.firstChild.click();
      });
    }
  </script>
</body>
</html>
