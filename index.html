<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
</head>
<body>
  <h1 id="msg">Loading...</h1>
  <script>
    async function loadData() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("Could not find data.json");
        const data = await response.json();
        document.getElementById('msg').innerText = "Data loaded successfully! Row count: " + data.length;
        console.log(data);
      } catch (err) {
        document.getElementById('msg').innerText = "ERROR: " + err.message;
      }
    }
    loadData();
  </script>
</body>
</html>
