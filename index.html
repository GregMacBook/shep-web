<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; background-color: #fcfaff; }
    body { display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* Header & Navigation layout */
    .header-wrapper { background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0; }
    .logo-header { padding: 5px; text-align: center; }
    
    /* Desktop layout for navigation menu */
    .nav-menu { display: flex; gap: 10px; padding: 12px 20px; width: 100%; box-sizing: border-box; justify-content: center; flex-wrap: wrap; }
    
    .tab { padding: 10px 20px; background: #ac8ad4; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: 600; color: #fff; text-transform: uppercase; font-size: 0.75em; letter-spacing: 0.5px; display: inline-block; border: none; }
    .tab.active { background: #916bbf; color: #fff; transform: scale(1.03); box-shadow: 0 2px 8px rgba(145, 107, 191, 0.3); }
    
    .main-container { flex-grow: 1; padding: 30px 40px; box-sizing: border-box; min-width: 0; width: 100%; max-width: 1200px; margin: 0 auto; }
    .divider { height: 4px; width: 60px; background: #84a59d; margin: 15px 0 30px 0; border-radius: 2px; }
    
    /* Standard Layout components */
    .appeal-card { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 12px; border-left: 8px solid #ac8ad4; display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: space-between; width: 100%; box-sizing: border-box; }
    .appeal-text-side { flex: 1; min-width: 300px; display: flex; justify-content: space-between; align-items: flex-start; flex-direction: column; }
    .appeal-text { font-size: 1.1em; line-height: 1.6; color: #333; flex-grow: 1; white-space: pre-wrap; width: 100%; }
    .appeal-text h3 { margin-top: 0; margin-bottom: 8px; color: #4a4e69; font-size: 1.4em; }
    
    .media-gallery-wrapper { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; width: 100%; box-sizing: border-box; }
    .gallery-figure { margin: 0; padding: 10px; background: #faf8ff; border: 1px solid #eae5f5; border-radius: 8px; text-align: center; width: calc(50% - 10px); min-width: 260px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); box-sizing: border-box; }
    
    .poster-img-side { width: 100%; max-width: 350px; height: auto; display: block; margin: 0 auto; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); object-fit: contain; }
    .figure-caption { font-size: 0.9em; font-weight: 600; color: #6b5b95; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Native Link Map Pins styled with pointer cursor */
    .location-pin { font-size: 1.6em; margin-left: 15px; padding: 5px; transition: transform 0.2s; display: inline-block; text-decoration: none; cursor: pointer; }
    .location-pin:hover { transform: scale(1.2); }
    
    /* Responsive grid columns */
    .collection-grid { display: flex; gap: 15px; flex-wrap: wrap; width: 100%; box-sizing: border-box; }
    
    .category-column { flex: 1; min-width: 240px; background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 5px; box-sizing: border-box; }
    .category-column.unacceptable { border-top: 4px solid #d9534f; }
    .category-header { color: #916bbf; border-bottom: 2px solid #ac8ad4; margin-bottom: 12px; text-align: center; font-weight: bold; font-size: 1em; padding-bottom: 5px; }
    
    .item-row { display: flex; align-items: center; margin-bottom: 8px; padding: 6px; border-bottom: 1px solid #f8f6fa; }
    .donation-img-small { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #eee; flex-shrink: 0; }
    .item-name { margin-left: 10px; font-weight: 600; color: #4a4e69; font-size: 0.85em; line-height: 1.3; }
    
    .pictures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .gallery-card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
    .gallery-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    
    /* UNIVERSAL BUTTON ANCHOR STYLE: Bypasses window.open() sandbox restrictions */
    .donate-btn { display: inline-block; margin-top: 20px; padding: 18px 45px; background: #84a59d; color: white; border-radius: 35px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 1.1em; text-align: center; cursor: pointer; }
    .action-link-btn { background: #916bbf; color: white; padding: 10px 20px; border-radius: 18px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; cursor: pointer; }
    .action-link-btn:hover { background: #ac8ad4; }
    
    .info-line { font-size: 1.2em; color: #4a4e69; margin: 10px 0; font-weight: 600; }
    
    /* Testimonial card adjustments */
    .testimonial-card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 25px; max-width: 900px; align-items: flex-start; border-left: 6px solid #ac8ad4; }
    .testimonial-media { width: 220px; min-width: 220px; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); background: #fafafa; }
    .testimonial-img { width: 100%; height: auto; max-height: 350px; display: block; object-fit: contain; }
    .testimonial-video { width: 100%; height: 150px; border: none; display: block; }
    .testimonial-body { flex-grow: 1; color: #4a4e69; line-height: 1.6; }
    .testimonial-sender { color: #916bbf; font-size: 1.15em; font-weight: 700; margin: 0 0 10px 0; border-bottom: 1px dashed #ac8ad4; padding-bottom: 5px; }

    .contact-link { color: #916bbf; text-decoration: none; font-weight: bold; transition: 0.2s; cursor: pointer; }
    .contact-link:hover { color: #ac8ad4; text-decoration: underline; }
    .visit-org-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #916bbf; color: white; border-radius: 18px; text-decoration: none; font-weight: bold; font-size: 0.85em; transition: 0.2s; cursor: pointer; }
    .visit-org-btn:hover { background: #ac8ad4; }

    /* Lockdown Screen Style */
    .lockdown-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; color: #4a4e69; padding: 20px; }
    .lockdown-title { font-size: 2.5em; color: #916bbf; margin-bottom: 15px; font-weight: bold; }
    .lockdown-text { font-size: 1.2em; max-width: 600px; line-height: 1.6; }

    /* MOBILE VIEWPORT STYLES */
    @media (max-width: 768px) { 
      .nav-menu { flex-direction: column !important; padding: 10px 15px !important; gap: 6px !important; width: 100% !important; }
      .tab { width: 100% !important; text-align: center !important; padding: 10px 15px !important; font-size: 0.75em !important; box-sizing: border-box !important; display: block !important; }
      
      .appeal-card { flex-direction: column; } 
      .poster-img-side { max-width: 100%; }
      .gallery-figure { width: 100%; }
      .testimonial-card { flex-direction: column; } 
      .testimonial-media { width: 100%; min-width: 100%; }
      .main-container { padding: 15px; }
      
      .collection-grid { gap: 10px; }
      .category-column { min-width: 140px; width: calc(50% - 5px); padding: 10px; margin-bottom: 0; }
      .category-header { font-size: 0.85em; margin-bottom: 8px; }
      .item-row { padding: 4px 2px; margin-bottom: 4px; }
      .donation-img-small { width: 35px; height: 35px; border-radius: 4px; }
      .item-name { margin-left: 6px; font-size: 0.75em; }
    }
  </style>
</head>
<body>

  <div class="header-wrapper">
    <div class="logo-header"><img src="https://i.imgur.com/Kge9euA.png" width="130"></div>
    <div id="tabs" class="nav-menu" style="display: none;"></div>
  </div>

  <div class="main-container">
    <h1 id="tab-title">SHEP</h1>
    <div class="divider"></div>
    <div id="content">Loading portal...</div>
  </div>

  <script>
    let allData = [];
    const annualAppealItems = ["MOTHERS' DAY", "MOTHER'S DAY", "FATHERS' DAY", "FATHER'S DAY", "EASTER", "CHRISTMAS", "WINTER", "HAMPER"];
    
    const scriptUrlBase = "https://script.google.com/macros/s/AKfycbwvHOgeop6wQkoWzzww3QGGttQv3UsZTlyipY3O9vAtAir1Ra2abUUv_d4RfXoJSDOa/exec";
    const statusJsonUrl = "https://raw.githubusercontent.com/gregmacbook/shep-web/main/status.json";

    function loadData() {
      fetch(scriptUrlBase)
        .then(response => response.json())
        .then(data => { 
          allData = data; 
          renderMenu(data);
          checkKillSwitch();
        })
        .catch(err => {
          document.getElementById('content').innerText = "Error syncing data.";
          console.error(err);
        });
    }

    function checkKillSwitch() {
      fetch(statusJsonUrl + "?t=" + new Date().getTime())
        .then(response => response.json())
        .then(config => {
          if (config && config.status && config.status.toUpperCase().trim() === "OFF") {
            renderLockdownScreen();
          }
        })
        .catch(err => console.log("Kill switch silent skip:", err));
    }

    function renderLockdownScreen() {
      document.getElementById('tabs').style.display = 'none';
      document.getElementById('tab-title').innerText = "System Maintenance";
      var display = document.getElementById('content');
      display.innerHTML = `
        <div class="lockdown-container">
          <div class="lockdown-title">Site Temporarily Offline</div>
          <div class="lockdown-text">
            <strong>Safe Haven Essential Packs (SHEP)</strong> is currently updating its content database to better serve the community. We will be back online shortly!
          </div>
        </div>
      `;
    }

    function formatText(text) {
      if (!text) return "";
      let txt = text.toString().replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      if (document.getElementById('tab-title').innerText.toUpperCase().trim() === "CONTACT SHEP") {
        txt = txt.replace(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/gi, '<a href="mailto:$1" class="contact-link" target="_blank">$1</a>');
        txt = txt.replace(/(\(?\d{2,4}\)?\s?\d{3,4}\s?\d{3,4})/gi, '<a href="tel:$1" class="contact-link" target="_blank">$1</a>');
      }
      return txt;
    }
    
    function getImgUrl(url, isSmall) {
      if (!url) return 'https://i.imgur.com/oAWTWfg.png';
      try {
        var str = url.toString().trim();
        if (str.toLowerCase().includes('imgur.com') || str.toLowerCase().includes('postimg.cc') || str.toLowerCase().match(/\.(jpeg|jpg|gif|png|webp)/)) {
          return str;
        }
        var match = str.match(/(?:id=|file\/d\/|usercontent\.com\/d\/)([a-zA-Z0-9_-]{25,50})/);
        if (match) {
          return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=' + (isSmall ? 'w120' : 's1000');
        }
        return str;
      } catch(e) { return 'https://i.imgur.com/oAWTWfg.png'; }
    }

    function getVideoEmbedUrl(url) {
      if (!url) return '';
      try {
        var str = url.toString().trim();
        var match = str.match(/(?:id=|file\/d\/|usercontent\.com\/d\/)([a-zA-Z0-9_-]{25,50})/);
        return match ? 'https://drive.google.com/file/d/' + match[1] + '/preview' : '';
      } catch(e) { return ''; }
    }

    function renderMenu(data) {
      var tabContainer = document.getElementById('tabs');
      tabContainer.innerHTML = "";
      tabContainer.style.display = 'flex';
      
      var explicitList = [];
      data.forEach(r => {
        if(r[0] && !annualAppealItems.includes(r[0].toUpperCase().trim()) && r[0].toString().trim() !== "DONATIONFORMURL" && r[0].toString().toUpperCase().trim() !== "INSTAGRAM" && r[0].toString().toUpperCase().trim() !== "FACEBOOK") {
          if(!explicitList.includes(r[0].toString().trim())) explicitList.push(r[0].toString().trim());
        }
      });
      
      var uniqueSections = [];
      explicitList.forEach(item => {
        uniqueSections.push(item);
        if (item.toUpperCase().trim() === "WHAT WE CAN'T ACCEPT" || item.toUpperCase().trim() === "WHAT WE CAN’T ACCEPT") {
          uniqueSections.push("Annual Appeals");
        }
      });
      if (!uniqueSections.includes("Annual Appeals")) {
        uniqueSections.unshift("Annual Appeals");
      }

      uniqueSections.forEach(sName => {
        var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = sName;
        btn.onclick = function() {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-title').innerText = sName;
          
          var display = document.getElementById('content'); 
          display.innerHTML = ""; 
          // FIX: Standardise comparison keys to handle hidden spacing variants safely
          var filterKey = sName.toLowerCase().trim();
          
          // 1. WHAT DO WE COLLECT
          if (filterKey === "what do we collect") {
            display.innerHTML = '<div class="collection-grid" id="coll-box">Loading categories...</div>';
            fetch(scriptUrlBase + "?action=collections")
              .then(response => response.json())
              .then(items => {
                var box = document.getElementById('coll-box'); box.innerHTML = "";
                var groups = {};
                items.slice(1).forEach(function(it) { 
                  if(!it[0] || it[0].trim() === "" || !it[1]) return;
                  if(!groups[it[0]]) groups[it[0]] = []; 
                  groups[it[0]].push(it); 
                });
                Object.keys(groups).forEach(function(g) {
                  var col = document.createElement('div'); col.className = 'category-column';
                  col.innerHTML = '<div class="category-header">' + g + '</div>';
                  groups[g].forEach(function(it) {
                    var r = document.createElement('div'); r.className = 'item-row';
                    r.innerHTML = '<div><img src="' + getImgUrl(it[2], true) + '" class="donation-img-small"></div><div class="item-name">' + it[1] + '</div>';
                    col.appendChild(r);
                  });
                  box.appendChild(col);
                });
              }).catch(err => { document.getElementById('coll-box').innerText = "Error loading elements."; });
            
          // 2. WHAT WE CAN'T ACCEPT
          } else if (filterKey === "what we can't accept" || filterKey === "what we can’t accept") {
            display.innerHTML = '<div class="collection-grid" id="unacceptable-box">Loading...</div>';
            fetch(scriptUrlBase + "?action=unacceptable")
              .then(response => response.json())
              .then(items => {
                var box = document.getElementById('unacceptable-box'); box.innerHTML = "";
                var groups = {};
                items.slice(1).forEach(function(it) { 
                  if(!it[0] || it[0].trim() === "" || !it[1]) return;
                  if(!groups[it[0]]) groups[it[0]] = []; 
                  groups[it[0]].push(it); 
                });
                Object.keys(groups).forEach(function(g) {
                  var col = document.createElement('div'); col.className = 'category-column unacceptable';
                  col.innerHTML = '<div class="category-header" style="color: #d9534f; border-bottom: 2px solid #d9534f;">' + g + '</div>';
                  groups[g].forEach(function(it) {
                    var r = document.createElement('div'); r.className = 'item-row';
                    r.innerHTML = '<div><img src="' + getImgUrl(it[2], true) + '" class="donation-img-small"></div><div class="item-name">' + it[1] + '</div>';
                    col.appendChild(r);
                  });
                  box.appendChild(col);
                });
              }).catch(err => { document.getElementById('unacceptable-box').innerText = "Error loading elements."; });
            
          // 3. PICTURES GALLERY
          } else if (filterKey === "pictures") {
            display.innerHTML = '<div class="pictures-grid" id="pic-box">Loading gallery...</div>';
            fetch(scriptUrlBase + "?action=pictures")
              .then(response => response.json())
              .then(pics => {
                var box = document.getElementById('pic-box'); box.innerHTML = "";
                pics.slice(1).forEach(function(p) {
                  if(!p[1]) return;
                  var card = document.createElement('div'); card.className = 'gallery-card';
                  card.innerHTML = '<img src="' + getImgUrl(p[1], false) + '" class="gallery-img"><div style="margin-top:10px;font-weight:bold;color:#4a4e69;">' + p[0] + '</div>';
                  box.appendChild(card);
                });
              }).catch(err => { document.getElementById('pic-box').innerText = "Error loading pictures."; });

          // 4. TESTIMONIALS
          } else if (filterKey === "testimonials") {
            display.innerHTML = '<div id="testimonial-box">Loading structured stories...</div>';
            fetch(scriptUrlBase + "?action=testimonials")
              .then(res => res.json())
              .then(rows => {
                var box = document.getElementById('testimonial-box'); box.innerHTML = "";
                rows.slice(1).forEach(function(cols) {
                  var senderName = cols[0] ? cols[0].trim() : "";
                  var mediaLink = cols[1] ? cols[1].trim() : "";
                  var storyText = cols[2] ? cols[2].trim() : "";
                  
                  if (!senderName && !storyText) return; 
                  
                  var card = document.createElement('div'); card.className = 'testimonial-card';
                  var isVideo = senderName.toUpperCase().includes("LITTLE THINGS FOR TINY TOTS");
                  
                  var mediaHtml = '<div class="testimonial-media"><img src="https://i.imgur.com/oAWTWfg.png" class="testimonial-img"></div>';
                  if (mediaLink) {
                    if (isVideo) {
                      mediaHtml = '<div class="testimonial-media"><iframe src="' + getVideoEmbedUrl(mediaLink) + '" class="testimonial-video" allow="autoplay"></iframe></div>';
                    } else {
                      mediaHtml = '<div class="testimonial-media"><img src="' + getImgUrl(mediaLink, false) + '" class="testimonial-img"></div>';
                    }
                  }
                  
                  card.innerHTML = mediaHtml + 
                                   '<div class="testimonial-body">' +
                                     '<div class="testimonial-sender">' + senderName + '</div>' +
                                     '<div>' + formatText(storyText).replace(/\n/g, '<br>') + '</div>' +
                                   '</div>';
                                   
                  box.appendChild(card);
                });
                if(box.children.length === 0) box.innerText = "No testimonials found.";
              }).catch(err => { document.getElementById('testimonial-box').innerText = "Error loading testimonials."; });

          // 5. MONETARY DONATIONS
          } else if (filterKey === "monetary donations") {
             let targetUrl = 'https://tinyurl.com/SHEPDonation'; 
             if (allData && allData.length > 0) {
               let foundRow = allData.find(r => r[0] && r[0].toString().toUpperCase().trim() === 'DONATIONFORMURL');
               if (foundRow && foundRow[1]) {
                 targetUrl = foundRow[1].toString().trim();
               }
             }

             display.innerHTML = `
               <div class="commentary-box">
                 <h3>Your Impact Matters</h3>
                 <p>At <strong>SHEP</strong>, every dollar donated goes toward providing hygiene essentials for those in our community. Thank you for your support.</p>
               </div>
               <div class="info-line" style="text-align: center;"><span>Account: SAFE HAVEN ESSENTIAL PACKS</span></div>
               <div class="info-line" style="text-align: center;"><span>BSB: 306821 / Acct: 6706014</span></div>
               <center>
                 <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="donate-btn">Complete Donation & Get Receipt</a>
               </center>
             `;
          
          // 6. STANDARD, MAP-LINK, ANNUAL APPEALS & GALLERY TILES
          } else {
            data.forEach(r => {
              var rName = r[0] ? r[0].toString().trim() : "";
              if (!rName) return;
              
              var isAppeal = annualAppealItems.includes(rName.toUpperCase());
              var rowKey = isAppeal ? "annual appeals" : rName.toLowerCase().trim();
              
              // REPAIRED ENGINE: Flexible lookup engine maps spacing variants flawlessly
              if (rowKey === filterKey) {
                var card = document.createElement('div'); card.className = 'appeal-card';
                var textHtml = "";
                var mediaGalleryHtml = "";
                var pinHtml = "";
                
                var colCLink = r[2] ? r[2].toString().trim() : "";
                
                if (filterKey === "who we help") {
                  var orgLinkHtml = (colCLink.toLowerCase().includes('http')) 
                                    ? `<br><a href="${colCLink}" target="_blank" rel="noopener noreferrer" class="visit-org-btn">Visit Website</a>` 
                                    : "";
                  
                  textHtml = `<div class="appeal-text-side">
                                <div class="appeal-text"><h3>${rName}</h3>${formatText(r[1]||'')} ${orgLinkHtml}</div>
                              </div>`;
                } else {
                  if (colCLink.toLowerCase().includes('http') && !colCLink.toLowerCase().match(/\.(jpeg|jpg|gif|png|webp)/) && !colCLink.toLowerCase().includes('drive.google')) {
                    pinHtml = `<a href="${colCLink}" target="_blank" rel="noopener noreferrer" class="location-pin">📍</a>`;
                  } else if (colCLink) {
                    var assetLinks = colCLink.split(',');
                    if (assetLinks.length > 1) {
                      mediaGalleryHtml = '<div class="media-gallery-wrapper">';
                      
                      var countIndex = 0;
                      assetLinks.forEach(item => {
                        var rawItem = item.trim();
                        var captionText = "School Donation"; 
                        var finalUrl = rawItem;

                        if (rawItem.includes(" - ")) {
                          var parts = rawItem.split(" - ");
                          captionText = parts[0].trim();
                          finalUrl = parts[1].trim();
                        } else {
                          if (rawItem.toLowerCase().includes("wpuvlvflo6ywb1uj0np4noasd20emqpa")) captionText = "Mercedes College";
                          if (rawItem.toLowerCase().includes("13ajfdkbpnqfmh_3v3efdfyouxvuiwsg")) captionText = "Cannington Senior High School";
                          
                          if (filterKey === "ways you can help") {
                            captionText = (countIndex === 0) ? "Mum and Bub 70x70 cms" : "Toiletry Bags 35x35cms";
                          }
                        }
                        
                        mediaGalleryHtml += `<figure class="gallery-figure">
                                               <img src="${getImgUrl(finalUrl, false)}" class="poster-img-side">
                                               <figcaption class="figure-caption">${captionText}</figcaption>
                                             </figure>`;
                        countIndex++;
                      });
                      mediaGalleryHtml += '</div>';
                    } else {
                      mediaGalleryHtml = `<img src="${getImgUrl(colCLink, false)}" class="poster-img-side">`;
                    }
                  }
                  
                  var linkUrl = r[3] ? r[3].toString().trim() : "";
                  var linkHtml = (isAppeal && linkUrl.length > 5) 
                                 ? `<a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="action-link-btn">View Poster</a>` 
                                 : "";
                  
                  textHtml = `<div class="appeal-text-side">
                                <div class="appeal-text"><h3>${rName}</h3>${formatText(r[1]||'')} ${linkHtml}</div>
                                ${pinHtml}
                              </div>`;
                }
                
                if (mediaGalleryHtml.includes("media-gallery-wrapper")) {
                  card.style.flexDirection = "column";
                  card.innerHTML = textHtml + mediaGalleryHtml;
                } else {
                  card.innerHTML = textHtml + mediaGalleryHtml;
                }
                
                display.appendChild(card);
              }
            });
          }
        };
        tabContainer.appendChild(btn);
      });
      if (tabContainer.firstChild) tabContainer.firstChild.click();
    }

    loadData();
  </script>
</body>
</html>
