<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; text-align: center; background: #fcfaff; }
    /* Horizontal Menu */
    .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
    .tab { width: 140px; height: 60px; background: #ac8ad4; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.75em; display: flex; align-items: center; justify-content: center; text-align: center; }
    .tab.active { background: #916bbf; }
    
    /* Content Area */
    #content { padding: 20px; max-width: 1000px; margin: auto; }
    .collection-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; text-align: left; }
    .category-column { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .item-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9em; }
    .donation-img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="tabs" class="nav-menu"></div>
  <h1 id="tab-title">SHEP</h1>
  <div id="content">Loading...</div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";
    
    // Initial fetch to build tabs
    fetch(scriptUrl).then(r => r.json()).then(data => {
      var tabs = [...new Set(data.map(r => r[0]).filter(n => n && n !== "DONATIONFORMURL"))];
      var container = document.getElementById('tabs');
      tabs.forEach(tName => {
        var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = tName;
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-title').innerText = tName;
          loadTabContent(tName, data);
        };
        container.appendChild(btn);
      });
      container.firstChild.click();
    });

    function loadTabContent(name, allData) {
      document.getElementById('content').innerHTML = "Loading...";
      if (name === "MONETARY DONATIONS") {
        var url = (allData.find(r => r[0] === 'DONATIONFORMURL') || [])[1] || "#";
        document.getElementById('content').innerHTML = '<a href="'+url+'" target="_blank" style="padding:20px 40px; background:#84a59d; color:white; text-decoration:none; border-radius:20px;">Complete Donation</a>';
      } else {
        fetch(scriptUrl + "?action=" + name).then(r => r.json()).then(items => {
          if (name === "WHAT DO WE COLLECT") { renderGrid(items); }
          else { renderSimpleContent(items); }
        });
      }
    }

    function renderGrid(items) {
      var groups = {};
      items.forEach(it => { if(!groups[it[0]]) groups[it[0]]=[]; groups[it[0]].push(it); });
      let html = '<div class="collection-grid">';
      Object.keys(groups).forEach(g => {
        html += '<div class="category-column"><h3>'+g+'</h3>';
        groups[g].forEach(it => { if(it[1]) html += '<div class="item-row"><img src="'+(it[2]||'')+'" class="donation-img"> '+it[1]+'</div>'; });
        html += '</div>';
      });
      document.getElementById('content').innerHTML = html + '</div>';
    }

    function renderSimpleContent(items) {
      let html = "<div>";
      items.forEach(it => {
        let text = it[1] || "";
        let url = it[2] || "";
        html += `<p>${text} ${url.includes('http') ? '<br><a href="'+url+'" target="_blank">Click for Map</a>' : ''}</p>`;
      });
      document.getElementById('content').innerHTML = html + "</div>";
    }
  </script>
</body>
</html>
