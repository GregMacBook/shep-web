<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    /* Ensure all 4 columns fit */
    .collection-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; }
    @media (max-width: 900px) { .collection-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <h1 id="tab-title">SHEP</h1>
  <div id="content">Loading...</div>

  <script>
    const scriptUrlBase = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";

    // 1. DYNAMICALLY LOAD ALL TABS
    function loadData() {
      fetch(scriptUrlBase)
        .then(res => res.json())
        .then(data => {
          var tabs = [...new Set(data.map(r => r[0]).filter(n => n && n !== "DONATIONFORMURL"))];
          renderMenu(tabs, data);
        });
    }

    function renderMenu(tabs, allData) {
      var tabContainer = document.getElementById('tabs');
      tabs.forEach(sName => {
        var btn = document.createElement('button'); btn.innerText = sName;
        btn.onclick = function() {
          document.getElementById('tab-title').innerText = sName;
          // Route by tab name
          if (sName === "MONETARY DONATIONS") {
            renderDonations(allData);
          } else {
            renderContent(sName);
          }
        };
        tabContainer.appendChild(btn);
      });
      tabContainer.firstChild.click(); // Load first tab
    }

    // 2. PATCHED DONATION URL FETCH
    function renderDonations(allData) {
      var donationRow = allData.find(r => r[0] && r[0].toString().toUpperCase() === 'DONATIONFORMURL');
      var url = donationRow ? donationRow[1] : "https://tinyurl.com/SHEPDonation";
      document.getElementById('content').innerHTML = '<a href="'+url+'" target="_blank">Complete Donation</a>';
    }

    // 3. STABLE RENDER ENGINE (as it was last night)
    function renderContent(tabName) {
      fetch(scriptUrlBase + "?action=" + tabName)
        .then(res => res.json())
        .then(items => {
          // ... [Your stable rendering logic here] ...
        });
    }
    loadData();
  </script>
</body>
</html>
