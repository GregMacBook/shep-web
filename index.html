<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHEP Diagnostic</title>
</head>
<body>
    <h1 id="status">Checking connection...</h1>
    <pre id="debug"></pre>

    <script>
        document.getElementById('status').innerText = "SYSTEM STATUS: ONLINE";
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('debug').innerText = "I found " + data.length + " rows of data.\n\nThe first row contains: " + JSON.stringify(data[0], null, 2);
            })
            .catch(err => {
                document.getElementById('debug').innerText = "Error: Could not find data.json. Check if the file is in the root folder.";
            });
    </script>
</body>
</html>
