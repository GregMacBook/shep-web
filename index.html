<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
  <style>
    /* ... keep your existing CSS ... */
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="content"></div>
  <script>
    async function loadData() {
      const res = await fetch('WebsiteContent.csv?t=' + new Date().getTime());
      const text = await res.text();
      const rows = text.split('\n');
      
      const display = document.getElementById('content');
      const tabContainer = document.getElementById('tabs');
      let tabs = {};
      let lastCat = ""; // Keep track of the active category

      rows.forEach((row, index) => {
        if (index === 0) return; // Skip the Header Row
        
        let cols = row.split(',');
        
        // If Col 0 has a value, update the current category
        if (cols[0] && cols[0].trim() !== "") {
           lastCat = cols[0].trim();
        }
        
        // Only process rows if we have a valid lastCat
        if (lastCat && (cols[1] || cols[2])) {
          if (!tabs[lastCat]) tabs[lastCat] = [];
          tabs[lastCat].push({ 
            text: cols[1] ? cols[1].trim() : "", 
            link: cols[2] ? cols[2].trim() : "" 
          });
        }
      });

      // Render Tabs
      Object.keys(tabs).forEach(cat => {
        let btn = document.createElement('div');
        btn.className = 'tab'; btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          display.innerHTML = `<h1>${cat}</h1>`;
          tabs[cat].forEach(item => {
            let div = document.createElement('div'); div.className = 'info-card';
            // Only add text if it's not the same as the category name
            if (item.text && item.text !== cat) div.innerHTML += `<div>${item.text}</div>`;
            if (item.link && item.link.startsWith('http')) {
              let url = item.link.replace('/view?usp=sharing', '/uc?export=view');
              div.innerHTML += `<img src="${url}">`;
            }
            display.appendChild(div);
          });
        };
        tabContainer.appendChild(btn);
      });
      if(tabContainer.firstChild) tabContainer.firstChild.click();
    }
    loadData();
  </script>
</body>
</html>
