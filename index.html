<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; background-color: #fcfaff; overflow: hidden; }
    body { display: flex; flex-direction: row; }
    .sidebar { width: 280px; min-width: 280px; background: #916bbf; display: flex; flex-direction: column; height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 20; overflow-y: auto; }
    .logo-header { padding: 15px; text-align: center; background: white; border-bottom: 3px solid #ac8ad4; position: sticky; top: 0; }
    .tab { padding: 16px 20px; margin: 6px 0 6px 15px; background: #ac8ad4; border-radius: 25px 0 0 25px; cursor: pointer; transition: 0.3s; font-weight: 600; color: #fff; text-transform: uppercase; font-size: 0.72em; letter-spacing: 1px; }
    .tab.active { background: #fcfaff; color: #4a4e69; margin-right: -1px; }
    .main-container { flex-grow: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; height: 100vh; min-width: 0; }
    .divider { height: 4px; width: 60px; background: #84a59d; margin: 15px 0 30px 0; border-radius: 2px; }
    .appeal-card { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; border-left: 8px solid #ac8ad4; }
    .appeal-left { display: flex; align-items: center; gap: 20px; }
    .appeal-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
    .row-images-container { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
    .row-attached-img { max-width: 220px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-header"><img src="https://i.imgur.com/Kge9euA.png" width="140"></div>
    <div id="tabs"></div>
  </div>
  <div class="main-container">
    <h1 id="tab-title">SHEP</h1>
    <div class="divider"></div>
    <div id="content">Loading content...</div>
  </div>

  <script>
    const annualAppealItems = ["MOTHERS' DAY", "MOTHER'S DAY", "FATHERS' DAY", "FATHER'S DAY", "EASTER", "CHRISTMAS", "WINTER", "HAMPER"];
    const scriptUrlBase = "https://script.google.com/macros/s/AKfycbww5xEpevxJK-nB8fAvY6gzc-_81QG98l9PT86vsCxA_JK7OZf0uvlOPrspQjadPGGH/exec";

    function getImgUrl(url, isSmall) {
      if (!url) return 'https://i.imgur.com/oAWTWfg.png';
      try {
        var str = url.toString().trim();
        var match = str.match(/(?:id=|file\/d\/|usercontent\.com\/d\/)([a-zA-Z0-9_-]{25,50})/);
        return match ? 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=' + (isSmall ? 'w120' : 'w800') : str;
      } catch(e) { return 'https://i.imgur.com/oAWTWfg.png'; }
    }

    function init() {
      fetch("status.json?nocache=" + new Date().getTime())
        .then(res => res.json())
        .then(data => { if(data.status === "OFF") showMaintenance(); else loadData(); })
        .catch(() => {
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(status => {
              if(status === "OFF") showMaintenance(); else loadData();
            }).getSiteStatus();
          } else { loadData(); }
        });
    }

    function showMaintenance() {
      document.getElementById('content').innerHTML = `<h1>Site under maintenance</h1><p>Please check back shortly.</p>`;
    }

    function loadData() {
      fetch(scriptUrlBase)
        .then(r => r.json())
        .then(data => renderMenu(data));
    }

    function renderMenu(data) {
      var tabContainer = document.getElementById('tabs');
      tabContainer.innerHTML = "";
      var uniqueSections = ["Annual Appeals"];
      data.forEach(r => {
        if(r[0] && !annualAppealItems.includes(r[0].toUpperCase().trim()) && r[0].toString().trim() !== "DONATIONFORMURL") {
          if(!uniqueSections.includes(r[0].toString().trim())) uniqueSections.push(r[0].toString().trim());
        }
      });
      
      uniqueSections.forEach(sName => {
        var btn = document.createElement('div'); btn.className = 'tab'; btn.innerText = sName;
        btn.onclick = function() {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-title').innerText = sName;
          var display = document.getElementById('content'); display.innerHTML = "";
          
          data.forEach(r => {
            var rName = r[0] ? r[0].toString().trim() : "";
            var isAppeal = annualAppealItems.includes(rName.toUpperCase());
            var currentKey = isAppeal ? "Annual Appeals" : rName;
            
            if (currentKey === sName) {
              var card = document.createElement('div'); card.className = 'appeal-card';
              
              // DEBUG: Print what we are looking at
              console.log("Checking Row:", rName, "Link data:", r[3]);

              var html = `<div class="appeal-left"><img src="${getImgUrl(r[2], true)}" class="appeal-thumb"><div><h3>${rName}</h3><p>${r[1]||''}</p></div></div>`;
              
              if (isAppeal) {
                // FORCED BUTTON: This will show up regardless of the link content
                var link = r[3] ? r[3].toString().trim() : "#";
                html += `<a href="${link}" target="_blank" style="background:red; color:white; padding:10px; border-radius:5px; margin-top:10px; display:inline-block;">TEST BUTTON</a>`;
              }
              
              card.innerHTML = html;
              display.appendChild(card);
            }
          });
        };
        tabContainer.appendChild(btn);
      });
      if (tabContainer.firstChild) tabContainer.firstChild.click();
    }
    
    init();
  </script>
</body>
</html>
