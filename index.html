<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    /* Tabs Layout */
    .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
    .tab { padding: 10px 20px; background: #ac8ad4; color: white; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
    .tab.active { background: #916bbf; }
    
    /* Content display: Hide by default, show only active */
    .page-content { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
    .page-content.active { display: block; }
  </style>
</head>
<body>
  <div id="tabs" class="nav-menu"></div>
  <div id="content-area"></div>

  <script>
    const scriptUrlBase = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";

    function loadData() {
      fetch(scriptUrlBase)
        .then(res => res.json())
        .then(data => {
          var tabs = [...new Set(data.map(r => r[0]).filter(n => n && n !== "DONATIONFORMURL"))];
          renderTabs(tabs, data);
        });
    }

    function renderTabs(tabs, allData) {
      var container = document.getElementById('tabs');
      var contentArea = document.getElementById('content-area');
      
      tabs.forEach(tabName => {
        // Create button
        var btn = document.createElement('button');
        btn.className = 'tab'; btn.innerText = tabName;
        
        // Create content panel for this tab
        var panel = document.createElement('div');
        panel.className = 'page-content';
        panel.id = 'panel-' + tabName;
        contentArea.appendChild(panel);
        
        btn.onclick = function() {
          // Switch active class
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          panel.classList.add('active');
          
          // Render content if empty
          if (panel.innerHTML === "") {
            if (tabName === "MONETARY DONATIONS") {
              var donateRow = allData.find(r => r[0] === 'DONATIONFORMURL');
              panel.innerHTML = '<center><h3>Your Support Matters</h3><a href="' + (donateRow ? donateRow[1] : "#") + '" target="_blank" style="padding: 15px 30px; background: #84a59d; color: white; border-radius: 20px; text-decoration: none;">Complete Donation</a></center>';
            } else {
              // This fetches data only for this specific tab
              fetch(scriptUrlBase + "?action=" + tabName)
                .then(res => res.json())
                .then(items => {
                  panel.innerHTML = "<h3>" + tabName + "</h3>" + renderGrid(items);
                });
            }
          }
        };
        container.appendChild(btn);
      });
      container.firstChild.click(); // Load first tab
    }

    function renderGrid(items) {
      // Your established horizontal grid logic here
      return "Content loaded..."; 
    }
    loadData();
  </script>
</body>
</html>
