<script>
    fetch('data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        const display = document.getElementById('content');
        const tabContainer = document.getElementById('tabs');
        
        // 1. Find all unique categories from Column A (Index 0)
        let lastCat = "";
        let categories = [];
        data.forEach(row => {
          let cat = Object.values(row)[0];
          if (cat && cat.trim() !== "") {
            if (!categories.includes(cat)) categories.push(cat);
            lastCat = cat;
          }
        });

        // 2. Build a tab for every category found
        categories.forEach((cat) => {
          if (cat === "DONATIONFORMURL") return; // Skip the URL row
          
          let btn = document.createElement('div');
          btn.className = 'tab'; btn.innerText = cat;
          btn.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            display.innerHTML = `<h1>${cat}</h1>`;
            
            // 3. Find and display rows for this category
            let currentCat = "";
            data.forEach(r => {
              let v = Object.values(r);
              if (v[0] && v[0].trim() !== "") currentCat = v[0];
              
              if (currentCat === cat && v[1] && v[1] !== "SUPPORTING PEOPLE") {
                let div = document.createElement('div'); div.className = 'info-line';
                div.innerHTML = `<strong>${v[1]}</strong>`;
                // Image from Column C (Index 2)
                if (v[2] && v[2].startsWith('http')) {
                  div.innerHTML += `<br><img src="${v[2].replace('/view?usp=sharing', '/uc?export=view')}" style="max-width:100%; border-radius:8px; margin-top:10px;">`;
                }
                display.appendChild(div);
              }
            });
          };
          tabContainer.appendChild(btn);
        });
        
        // Click first tab automatically
        if(tabContainer.firstChild) tabContainer.firstChild.click();
      });
</script>
