<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHEP Portal</title>
  <style>
    /* Add your existing CSS styling here */
    body { font-family: sans-serif; background: #fcfaff; margin: 0; }
    #tabs { display: flex; flex-wrap: wrap; background: #916bbf; padding: 10px; }
    .tab { padding: 10px 15px; color: white; cursor: pointer; font-weight: bold; }
    .tab.active { background: #ac8ad4; border-radius: 5px; }
    .info-line { background: white; padding: 15px; margin: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="content">Loading content...</div>

  <script>
    // This tells the browser to look for the data file in the same folder as index.html
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const display = document.getElementById('content');
        const tabContainer = document.getElementById('tabs');
        
        // This processes your JSON data array
        // (Ensure your JSON structure is an array of arrays if you use this logic)
        const categories = [...new Set(data.map(r => r[0]))].filter(Boolean);
        
        categories.forEach(cat => {
            let btn = document.createElement('div');
            btn.className = 'tab'; btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                display.innerHTML = `<h1>${cat}</h1>`;
                data.filter(r => r[0] === cat).forEach(row => {
                    let div = document.createElement('div'); div.className = 'info-line';
                    div.innerHTML = `<strong>${row[1] || ''}</strong><p>${row[2] || ''}</p>`;
                    display.appendChild(div);
                });
            };
            tabContainer.appendChild(btn);
        });
        tabContainer.firstChild.click();
      })
      .catch(err => {
        document.getElementById('content').innerText = "Error loading data. Please check if data.json exists.";
        console.error(err);
      });
  </script>
</body>
</html>
