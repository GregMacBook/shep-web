<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Diagnostic</title>
</head>
<body>
  <h1>Diagnostic Page</h1>
  <div id="debug" style="font-family: monospace; white-space: pre;"></div>
  <script>
    async function debug() {
      const dbg = document.getElementById('debug');
      try {
        const res = await fetch('WebsiteContent.csv?t=' + new Date().getTime());
        const text = await res.text();
        const lines = text.split('\n');
        
        dbg.innerText = "File loaded successfully!\n\nFirst 10 lines:\n" + lines.slice(0, 10).join('\n');
        
        let foundCat = lines[1].split(',')[0];
        dbg.innerText += "\n\nDetected First Category in Column 0: [" + foundCat + "]";
      } catch (e) {
        dbg.innerText = "Error: " + e.message;
      }
    }
    debug();
  </script>
</body>
</html>
