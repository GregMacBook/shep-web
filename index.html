<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
  <style>
    body { font-family: sans-serif; background: #fcfaff; margin: 0; }
    #tabs { display: flex; flex-wrap: wrap; background: #916bbf; padding: 10px; position: sticky; top: 0; z-index: 100; }
    .tab { padding: 12px 20px; color: white; cursor: pointer; font-weight: bold; font-size: 0.8em; text-transform: uppercase; }
    .tab.active { background: #ac8ad4; border-radius: 5px; }
    #content { padding: 20px; max-width: 900px; margin: auto; }
    .info-line { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .action-link-btn { display: inline-block; padding: 10px 20px; background: #84a59d; color: white; text-decoration: none; border-radius: 20px; font-weight: bold; margin-top: 10px; cursor: pointer; border: none; }
    .commentary-box { background: #f0e6ff; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ac8ad4; }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="content"></div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
      fetch('data.json')
        .then(response => response.json())
        .then(data => {
          const display = document.getElementById('content');
          const tabContainer = document.getElementById('tabs');
          
          // Get unique categories from Column A (Index 0)
          let categories = [...new Set(data.map(r => Object.values(r)[0]))].filter(cat => cat && cat !== "DONATIONFORMURL");
          categories.sort((a, b) => a === "OUR MISSION" ? -1 : (b === "OUR MISSION" ? 1 : 0));
          
          categories.forEach((cat, index) => {
            let btn = document.createElement('div');
            btn.className = 'tab'; btn.innerText = cat;
            btn.onclick = () => {
              document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
              btn.classList.add('active');
              
              if (cat === "MONETARY DONATIONS") {
                display.innerHTML = `
                  <div class="commentary-box"><h3>Your Impact Matters</h3><p>At <strong>SHEP</strong>, every dollar donated goes toward providing hygiene essentials for those in our community. Thank you for your support.</p></div>
                  <div class="info-line"><span>Account: SAFE HAVEN ESSENTIAL PACKS</span></div>
                  <div class="info-line"><span>BSB: 306821 / Acct: 6706014</span></div>
                  <center><button class="action-link-btn" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScuk3Pg3a4wVbkR60Pe6ni3EUNsMdLySbCuNF-mzXvXy8JwpQ/viewform', '_blank')">Complete Donation & Get Receipt</button></center>
                `;
              } else {
                display.innerHTML = `<h1>${cat}</h1>`;
                let div = document.createElement('div'); div.className = 'info-line';
                
                // Collect all text and images for this category
                let allText = [];
                let allImages = [];
                
                data.filter(r => Object.values(r)[0] === cat).forEach(row => {
                  let vals = Object.values(row);
                  if (vals[1] && vals[1].length > 1) allText.push(vals[1]);
                  if (vals[2] && vals[2].startsWith('http')) allImages.push(vals[2]);
                });
                
                // Render all collected text
                div.innerHTML = `<strong>${allText.join('<br><br>')}</strong>`;
                
                // Render all collected images
                allImages.forEach(img => {
                  let imgUrl = img.includes('drive.google.com') ? img.replace('/view?usp=sharing', '/uc?export=view') : img;
                  let size = (cat === "OUR MISSION") ? "50%" : "100%";
                  div.innerHTML += `<br><img src="${imgUrl}" style="max-width:${size}; border-radius:8px; margin-top:10px;">`;
                });
                
                display.appendChild(div);
              }
            };
            tabContainer.appendChild(btn);
            if (index === 0) btn.click();
          });
        });
    });
</script>
</body>
</html>
