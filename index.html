<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHEP Portal</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; background-color: #fcfaff; overflow: hidden; }
    body { display: flex; flex-direction: row; }
    .sidebar { width: 280px; min-width: 280px; background: #916bbf; display: flex; flex-direction: column; height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 20; overflow-y: auto; }
    .logo-header { padding: 15px; text-align: center; background: white; border-bottom: 3px solid #ac8ad4; position: sticky; top: 0; }
    .tab { padding: 16px 20px; margin: 6px 0 6px 15px; background: #ac8ad4; border-radius: 25px 0 0 25px; cursor: pointer; transition: 0.3s; font-weight: 600; color: #fff; text-transform: uppercase; font-size: 0.72em; letter-spacing: 1px; }
    .tab.active { background: #fcfaff; color: #4a4e69; margin-right: -1px; }
    .main-container { flex-grow: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; height: 100vh; min-width: 0; }
    .divider { height: 4px; width: 60px; background: #84a59d; margin: 15px 0 30px 0; border-radius: 2px; }
    .info-line { margin-bottom: 12px; padding: 18px 22px; border-left: 8px solid #84a59d; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); color: #4a4e69; max-width: 900px; }
    .donate-btn { display: inline-block; margin-top: 20px; padding: 18px 45px; background: #84a59d; color: white; border-radius: 35px; font-weight: bold; cursor: pointer; text-decoration: none; border: none; text-transform: uppercase; font-size: 1.1em; }
    .action-link-btn { display: inline-block; padding: 6px 12px; background: #ac8ad4; color: white; text-decoration: none; border-radius: 6px; font-size: 0.85em; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-header"><img src="https://drive.google.com/thumbnail?id=1jotHfaZhBe9jKnjWK7Ldz_MXl5Pb6Loe&sz=w300" width="140" alt="SHEP Logo"></div>
    <div id="tabs"></div>
  </div>
  <div class="main-container">
    <h1 id="tab-title">SHEP Portal</h1>
    <div class="divider"></div>
    <div id="content">Loading content...</div>
  </div>
  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbww5xEpevxJK-nB8fAvY6gzc-_81QG98l9PT86vsCxA_JK7OZf0uvlOPrspQjadPGGH/exec";
    const cleanMenuKeys = ["OUR MISSION", "ABOUT US", "ANNUAL APPEALS", "WHAT DO WE COLLECT", "WHAT WE CAN'T ACCEPT", "WHO WE HELP", "WAYS YOU CAN HELP", "DONATION POINTS", "SCHOOL DONORS", "REGISTRATION", "TESTIMONIALS", "MONETARY DONATIONS", "CONTACT SHEP"];

    function formatBold(text) { 
      return text.toString().replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
    }

    fetch(scriptUrl).then(r => r.json()).then(data => {
        var tabContainer = document.getElementById('tabs');
        var display = document.getElementById('content');
        cleanMenuKeys.forEach(function(tName) {
          var btn = document.createElement('div');
          btn.className = 'tab'; btn.innerText = tName;
          btn.onclick = function() {
            document.getElementById('tab-title').innerText = tName;
            display.innerHTML = "";
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            if (tName === "MONETARY DONATIONS") {
              display.innerHTML = `<div class="info-line"><h3>Your Impact Matters</h3><p>At <strong>SHEP</strong>, every dollar donated goes toward providing hygiene essentials for those in our community.</p></div><div class="info-line"><span>Account: SAFE HAVEN ESSENTIAL PACKS</span><br><span>BSB: 306821 / Acct: 6706014</span></div><center><button class="donate-btn" onclick="window.open('https://tinyurl.com/SHEPDonation', '_blank')">Complete Donation & Get Receipt</button></center>`;
              return;
            }

            if (tName === "OUR MISSION") {
              let row = data.find(r => r[0] && r[0].toString().toUpperCase().trim() === "OUR MISSION");
              if(row) {
                 let text = row[1] || "";
                 let img = row[2] || "";
                 display.innerHTML = `<div style="display:flex; align-items:center; gap:30px; background:white; padding:30px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);"><div style="flex:1;"><p style="font-size:1.5em; font-weight:bold;">${text.replace(/\n/g, '<br>')}</p></div>${img ? `<div style="flex:1;"><img src="${img}" style="max-width:100%; border-radius:12px;"></div>` : ''}</div>`;
              }
              return;
            }

            if (tName === "ANNUAL APPEALS") {
              let rows = data.filter(r => r[0] && r[0].toString().toUpperCase().trim() === "ANNUAL APPEALS");
              rows.forEach(r => {
                let title = r[1] || "", details = r[2] || "";
                display.innerHTML += `<div class="info-line"><h2>${formatBold(title)}</h2><p>${formatBold(details.replace(/\n/g, '<br>'))}</p></div>`;
              });
              return;
            }

            let found = false;
            data.forEach(row => {
              if (row[0] && row[0].toString().trim().toUpperCase() === tName) {
                found = true;
                let text = [], imgs = [], links = [];
                for(let c=1; c<row.length; c++) {
                  let v = row[c] ? row[c].toString().trim() : "";
                  if(!v) continue;
                  if(v.startsWith("http")) {
                    if(v.includes("jpg") || v.includes("png") || v.includes("jpeg") || v.includes("googleusercontent")) imgs.push(v);
                    else links.push(v);
                  } else text.push(formatBold(v));
                }
                let card = document.createElement('div'); card.className = 'info-line';
                card.innerHTML = `<span>${text.join('<br>')}</span>`;
                links.forEach(l => card.innerHTML += `<a href="${l}" class="action-link-btn" target="_blank">🔗 Link</a>`);
                imgs.forEach(i => card.innerHTML += `<img src="${i}" style="max-width:100%; margin-top:10px; border-radius:10px;">`);
                display.appendChild(card);
              }
            });
            if (!found) display.innerHTML = '<div class="info-line">Database syncing...</div>';
          };
          tabContainer.appendChild(btn);
        });
        tabContainer.firstChild.click();
    });
  </script>
</body>
</html>
