<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
</head>
<body>
    <h1 id="test">Loading...</h1>
    <script>
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not find data.json");
                return response.json();
            })
            .then(data => {
                document.getElementById('test').innerText = "Data loaded! Found " + data.length + " items.";
                console.log(data);
            })
            .catch(err => {
                document.getElementById('test').innerText = "Error: " + err.message;
                console.error(err);
            });
    </script>
</body>
</html>
