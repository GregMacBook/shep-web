<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; background-color: #fcfaff; overflow: hidden; }
    body { display: flex; flex-direction: row; }
    .sidebar { width: 280px; min-width: 280px; background: #916bbf; display: flex; flex-direction: column; height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 20; overflow-y: auto; }
    .logo-header { padding: 15px; text-align: center; background: white; border-bottom: 3px solid #ac8ad4; position: sticky; top: 0; }
    .tab { padding: 16px 20px; margin: 6px 0 6px 15px; background: #ac8ad4; border-radius: 25px 0 0 25px; cursor: pointer; transition: 0.3s; font-weight: 600; color: #fff; text-transform: uppercase; font-size: 0.72em; letter-spacing: 1px; }
    .tab.active { background: #fcfaff; color: #4a4e69; margin-right: -1px; }
    .main-container { flex-grow: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; height: 100vh; min-width: 0; }
    .divider { height: 4px; width: 60px; background: #84a59d; margin: 15px 0 30px 0; border-radius: 2px; }
    .info-line { margin-bottom: 15px; padding: 22px; border-left: 8px solid #84a59d; background: white; border-radius: 12px; display: flex; flex-direction: column; }
    .appeal-card { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; border-left: 8px solid #ac8ad4; }
    .appeal-left { display: flex; align-items: center; gap: 20px; }
    .appeal-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-header"><img src="https://i.imgur.com/oAWTWfg.png" width="140"></div>
    <div id="tabs"></div>
  </div>
  <div class="main-container">
    <h1 id="tab-title">SHEP</h1>
    <div class="divider"></div>
    <div id="content">Syncing data...</div>
  </div>
  <script>
    let allData = [];
    const annualAppealItems = ["MOTHERS' DAY", "MOTHER'S DAY", "FATHERS' DAY", "FATHER'S DAY", "EASTER", "CHRISTMAS", "WINTER", "HAMPER"];
    fetch("https://script.google.com/macros/s/AKfycbww5xEpevxJK-nB8fAvY6gzc-_81QG98l9PT86vsCxA_JK7OZf0uvlOPrspQjadPGGH/exec")
      .then(r => r.json()).then(data => { allData = data; renderMenu(data); });

    function renderMenu(data) {
      var tabContainer = document.getElementById('tabs');
      tabContainer.innerHTML = "";
      
      // Get unique sections, ensuring "Annual Appeals" is included if appeals exist
      var uniqueSections = [];
      data.forEach(r => {
        if(!r[0]) return;
        var sName = r[0].toString().trim();
        var isAppeal = annualAppealItems.includes(sName.toUpperCase().trim());
        var sectionKey = isAppeal ? "Annual Appeals" : sName;
        if (sName !== "DONATIONFORMURL" && sName !== "INSTAGRAM" && sName !== "FACEBOOK" && !uniqueSections.includes(sectionKey)) {
          uniqueSections.push(sectionKey);
        }
      });
      
      uniqueSections.forEach(sectionName => {
        var btn = document.createElement('div');
        btn.className = 'tab'; btn.innerText = sectionName;
        btn.onclick = function() {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-title').innerText = sectionName;
          var display = document.getElementById('content');
          display.innerHTML = "";
          
          data.forEach(r => {
            if(!r[0]) return;
            var rName = r[0].toString().trim();
            var isAppeal = annualAppealItems.includes(rName.toUpperCase().trim());
            var currentKey = isAppeal ? "Annual Appeals" : rName;
            
            if (currentKey === sectionName) {
              if (isAppeal) {
                // RENDER APPEAL CARD WITH LINK
                var posterUrl = r[3] ? r[3].toString().trim().replace('/view?usp=sharing', '/preview') : '';
                var card = document.createElement('div');
                card.className = 'appeal-card';
                var content = `<div class="appeal-left"><img src="${r[2] || 'https://i.imgur.com/oAWTWfg.png'}" class="appeal-thumb"><div><h3>${rName}</h3><p>${r[1]||''}</p></div></div>`;
                card.innerHTML = posterUrl ? `<a href="${posterUrl}" target="_top" style="text-decoration:none; color:inherit; width:100%; display:flex; justify-content:space-between; align-items:center;">${content}<span class="inline-action-btn">📄 View Poster</span></a>` : content;
                display.appendChild(card);
              } else {
                // RENDER STANDARD PAGE WITH IMAGES
                var rowDiv = document.createElement('div'); rowDiv.className = 'info-line';
                rowDiv.innerHTML = `<div class="text-container-block">${(r[1]||'').toString().replace(/\n/g, '<br>')}</div>`;
                if(r[2]) {
                  var imgCont = document.createElement('div'); imgCont.className = 'row-images-container';
                  r[2].toString().split(',').forEach(u => {
                    var img = document.createElement('img'); img.src = getImgUrl(u.trim(), false); img.className = 'row-attached-img';
                    imgCont.appendChild(img);
                  });
                  rowDiv.appendChild(imgCont);
                }
                display.appendChild(rowDiv);
              }
            }
          });
        };
        tabContainer.appendChild(btn);
      });
      tabContainer.firstChild.click();
    }
  </script>
</body>
</html>
