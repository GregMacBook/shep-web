<script>
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const display = document.getElementById('content');
        const tabContainer = document.getElementById('tabs');
        
        // 1. Get Categories
        const categories = [...new Set(data.map(r => r["OUR MISSION"]))].filter(Boolean);
        
        // 2. Build Tabs
        categories.forEach(cat => {
            let btn = document.createElement('div');
            btn.className = 'tab'; btn.innerText = cat;
            btn.onclick = () => {
                // Highlight active tab
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                
                // Clear and build content
                display.innerHTML = `<h1>${cat}</h1>`;
                
                // Filter rows for this category
                data.filter(r => r["OUR MISSION"] === cat).forEach(row => {
                    let div = document.createElement('div'); div.className = 'info-line';
                    
                    // Access fields by specific keys based on your JSON structure
                    let title = row["SUPPORTING PEOPLE\n\nRESTORING DIGNITY\n\nSHARING HOPE"] || '';
                    let body = Object.values(row)[2] || ''; // This captures the description/link field
                    
                    div.innerHTML = `<strong>${title}</strong><p>${body}</p>`;
                    
                    // Display images if available (Looking for http in the row values)
                    Object.values(row).forEach(val => {
                        if (typeof val === 'string' && val.startsWith('http') && (val.includes('imgur') || val.includes('drive'))) {
                            let imgUrl = val.includes('drive.google.com') ? 
                                         val.replace('/view?usp=sharing', '/uc?export=view') : val;
                            div.innerHTML += `<br><img src="${imgUrl}" style="max-width:100%; border-radius:8px; margin-top:10px;">`;
                        }
                    });
                    
                    display.appendChild(div);
                });
            };
            tabContainer.appendChild(btn);
        });
        
        // 3. Trigger first tab
        if(tabContainer.firstChild) tabContainer.firstChild.click();
      })
      .catch(err => {
        console.error("Rendering error:", err);
      });
</script>
