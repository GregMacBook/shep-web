<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; text-align: center; background: #fcfaff; }
    .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
    .tab { padding: 10px 20px; background: #ac8ad4; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
    .tab.active { background: #916bbf; }
    .page-panel { display: none; padding: 20px; max-width: 1000px; margin: auto; text-align: left; }
    .page-panel.active { display: block; }
    .item-img { width: 50px; height: 50px; object-fit: cover; }
  </style>
</head>
<body>
  <div id="tabs" class="nav-menu"></div>
  <div id="content-area"></div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";
    // Full list of tabs from your sheet
    const myTabs = ['ABOUT US', 'Mothers\' Day', 'Fathers\' Day', 'Easter', 'Christmas', 'Winter', 'Hamper', 'WHAT DO WE COLLECT', 'WHAT WE CAN\'T ACCEPT', 'WHO WE HELP', 'WAYS YOU CAN HELP', 'DONATION POINTS', 'SCHOOL DONORS', 'REGISTRATION', 'TESTIMONIALS', 'MONETARY DONATIONS', 'CONTACT SHEP'];

    fetch(scriptUrl).then(r => r.json()).then(data => {
      var container = document.getElementById('tabs');
      var contentArea = document.getElementById('content-area');
      
      myTabs.forEach(tName => {
        var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = tName;
        var panel = document.createElement('div'); panel.className = 'page-panel';
        panel.id = 'panel-' + tName;
        contentArea.appendChild(panel);
        
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          panel.classList.add('active');
          
          if(panel.innerHTML === "") {
             var filtered = data.filter(r => r[0] === tName);
             panel.innerHTML = renderSmart(tName, filtered);
          }
        };
        container.appendChild(btn);
      });
      container.firstChild.click();
    });

    function renderSmart(tName, items) {
      let html = "<h3>" + tName + "</h3>";
      items.forEach(it => {
        // it[1] is main content, it[2] is image/link
        let text = it[1] || "";
        let link = it[2] || "";
        if (tName === "WHAT DO WE COLLECT" && link.includes("http")) {
           html += `<p><img src="${link}" class="item-img"> ${text}</p>`;
        } else if (link.includes("http")) {
           html += `<p>${text} <br><a href="${link}" target="_blank">Click for more</a></p>`;
        } else {
           html += `<p>${text}</p>`;
        }
      });
      return html;
    }
  </script>
</body>
</html>
