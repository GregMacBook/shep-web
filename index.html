<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
</head>
<body>
  <h1 id="status">Loading...</h1>
  <div id="content"></div>
  
  <script>
    async function init() {
      const status = document.getElementById('status');
      try {
        const res = await fetch('WebsiteContent.csv?t=' + new Date().getTime());
        if (!res.ok) throw new Error("Could not find WebsiteContent.csv");
        
        const text = await res.text();
        status.innerText = "Data Loaded! (Lines: " + text.split('\n').length + ")";
        document.getElementById('content').innerText = text.substring(0, 500);
      } catch (e) {
        status.innerText = "Error: " + e.message;
      }
    }
    init();
  </script>
</body>
</html>
