<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
  <style>
    /* ... keep your existing CSS ... */
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="content"></div>
  <script>
    async function loadData() {
      const res = await fetch('WebsiteContent.csv?t=' + new Date().getTime());
      const text = await res.text();
      
      // Robust CSV Parser: Handles commas inside quotes automatically
      const parseCSV = (str) => {
        const arr = [];
        let quote = false;
        let row = [''];
        for (let i = 0, col = 0; i < str.length; i++) {
          let char = str[i], next = str[i+1];
          if (char === '"') { quote = !quote; continue; }
          if (char === ',' && !quote) { row[++col] = ''; }
          else if (char === '\n' && !quote) { arr.push(row); row = ['']; col = 0; }
          else { row[col] += char; }
        }
        return arr;
      };

      const rows = parseCSV(text);
      const display = document.getElementById('content');
      const tabContainer = document.getElementById('tabs');
      let tabs = {};
      let lastCat = "";
      const validTabs = ["OUR MISSION", "ABOUT US", "ANNUAL APPEALS", "WHAT DO WE COLLECT", "WHAT WE CAN'T COLLECT", "WHO WE HELP", "WAYS YOU CAN HELP", "DONATION POINTS", "SCHOOL DONORS", "PICTURES", "REGISTRATION", "TESTIMONIALS", "MONETARY DONATIONS", "CONTACT SHEP"];

      rows.forEach((cols, index) => {
        if (index === 0) return; // Skip Header
        let col0 = cols[0] ? cols[0].trim() : "";
        if (validTabs.includes(col0)) lastCat = col0;
        
        if (lastCat && (cols[1] || cols[2])) {
          if (!tabs[lastCat]) tabs[lastCat] = [];
          tabs[lastCat].push({ text: cols[1] ? cols[1].trim() : "", link: cols[2] ? cols[2].trim() : "" });
        }
      });

      // ... rest of your existing rendering code stays the same ...
      // Render Tabs
      Object.keys(tabs).forEach(cat => {
        let btn = document.createElement('div');
        btn.className = 'tab'; btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          display.innerHTML = `<h1>${cat}</h1>`;
          tabs[cat].forEach(item => {
            let div = document.createElement('div'); div.className = 'info-card';
            // Only add text if it's not the same as the category name
            if (item.text && item.text !== cat) div.innerHTML += `<div>${item.text}</div>`;
            if (item.link && item.link.startsWith('http')) {
              let url = item.link.replace('/view?usp=sharing', '/uc?export=view');
              div.innerHTML += `<img src="${url}">`;
            }
            display.appendChild(div);
          });
        };
        tabContainer.appendChild(btn);
      });
      if(tabContainer.firstChild) tabContainer.firstChild.click();
    }
    loadData();
  </script>
</body>
</html>
