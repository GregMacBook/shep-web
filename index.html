<script>
    window.addEventListener('DOMContentLoaded', () => {
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const display = document.getElementById('content');
                const tabContainer = document.getElementById('tabs');
                
                const categories = [...new Set(data.map(r => r["OUR MISSION"]))].filter(cat => cat !== "DONATIONFORMURL" && cat);
                
                categories.forEach((cat, index) => {
                    let btn = document.createElement('div');
                    btn.className = 'tab'; btn.innerText = cat;
                    btn.onclick = () => {
                        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        btn.classList.add('active');
                        
                        // Custom layout for Monetary Donations
                        if (cat === "MONETARY DONATIONS") {
                            display.innerHTML = `
                                <div class="info-line"><h3>Your Impact Matters</h3>
                                <p>At <strong>SHEP</strong>, every dollar donated goes toward providing hygiene essentials for those in our community. Thank you for your support.</p></div>
                                <div class="info-line"><span>Account: JESSICA LEIGH POOLEY</span></div>
                                <div class="info-line"><span>BSB: 306821 / Acct: 6706014</span></div>
                                <center><button class="action-link-btn" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScuk3Pg3a4wVbkR60Pe6ni3EUNsMdLySbCuNF-mzXvXy8JwpQ/viewform', '_blank')">Complete Donation & Get Receipt</button></center>
                            `;
                        } else {
                            // Standard layout for other sections
                            display.innerHTML = `<h1>${cat}</h1>`;
                            data.filter(r => r["OUR MISSION"] === cat).forEach(row => {
                                let div = document.createElement('div'); div.className = 'info-line';
                                let title = row["SUPPORTING PEOPLE\n\nRESTORING DIGNITY\n\nSHARING HOPE"] || '';
                                div.innerHTML = `<span>${title}</span>`;
                                display.appendChild(div);
                            });
                        }
                    };
                    tabContainer.appendChild(btn);
                    if (index === 0) btn.click();
                });
            });
    });
</script>
