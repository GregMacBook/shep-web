<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SHEP Portal</title>
</head>
<body>
  <div id="tabs"></div>
  <div id="content"></div>
  <script>
    fetch('data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        try {
          const display = document.getElementById('content');
          const tabContainer = document.getElementById('tabs');
          let tabs = {};
          let currentCat = null;

          data.forEach((row, index) => {
            let vals = Object.values(row);
            if (vals[0] && vals[0].trim() !== "" && vals[0] !== "DONATIONFORMURL") {
              currentCat = vals[0];
              if (!tabs[currentCat]) tabs[currentCat] = [];
            }
            
            if (currentCat) {
              for (let i = 1; i < vals.length; i++) {
                if (vals[i] && vals[i].toString().trim() !== "" && !vals[i].includes("SUPPORTING PEOPLE")) {
                  tabs[currentCat].push(vals[i]);
                }
              }
            }
          });

          Object.keys(tabs).forEach(catName => {
            let btn = document.createElement('div');
            btn.innerText = catName;
            btn.onclick = () => {
              display.innerHTML = `<h1>${catName}</h1>`;
              tabs[catName].forEach(item => {
                let div = document.createElement('div');
                if (item.startsWith('http')) {
                  let url = item.replace('/view?usp=sharing', '/uc?export=view');
                  div.innerHTML = `<img src="${url}" style="max-width:100%;">`;
                } else {
                  div.innerHTML = `<strong>${item}</strong>`;
                }
                display.appendChild(div);
              });
            };
            tabContainer.appendChild(btn);
          });
        } catch(e) {
          document.body.innerText = "Error encountered: " + e.message;
        }
      })
      .catch(err => { document.body.innerText = "Fetch error: " + err; });
  </script>
</body>
</html>
