<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* Tab Container */
    .nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
    .tab { padding: 10px 20px; background: #ac8ad4; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
    .tab.active { background: #916bbf; }
    /* Content Area */
    #content { padding: 20px; max-width: 1000px; margin: auto; }
  </style>
</head>
<body>
  <div id="tabs" class="nav-menu"></div>
  <div id="content">Please select a tab.</div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbycfZErUOOIJE_QEfj0SYZLz6qPK6hHMxQ5jxgLFwfHiSRC-22rmvrj61zleoaduA/exec";
    
    // 1. Initialize Tabs
    fetch(scriptUrl).then(r => r.json()).then(data => {
      var tabs = [...new Set(data.map(r => r[0]).filter(n => n && n !== "DONATIONFORMURL"))];
      var tabContainer = document.getElementById('tabs');
      tabs.forEach(tName => {
        var btn = document.createElement('button'); btn.className = 'tab'; btn.innerText = tName;
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadTabContent(tName);
        };
        tabContainer.appendChild(btn);
      });
      tabContainer.firstChild.click(); // Default to first tab
    });

    // 2. Fetch data PER TAB
    function loadTabContent(name) {
      document.getElementById('content').innerHTML = "Loading...";
      fetch(scriptUrl + "?action=" + name).then(r => r.json()).then(items => {
        // Render based on the page type
        if (name === "WHAT DO WE COLLECT") {
            renderGrid(items); // Use the horizontal grid renderer
        } else {
            renderSimpleContent(items); // Use a standard text/image renderer
        }
      });
    }
  </script>
</body>
</html>
